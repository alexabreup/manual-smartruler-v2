<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Ruler 3D - Componente Interativo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "surface-tint": "#a14000",
                "tertiary-fixed-dim": "#7ed0ff",
                "tertiary-container": "#00a0d9",
                "primary-fixed": "#ffdbcc",
                "surface-dim": "#ebd6cd",
                "surface": "#fff8f6",
                "on-secondary-container": "#636262",
                "on-secondary-fixed": "#1c1b1b",
                "surface-container-low": "#fff1ec",
                "outline-variant": "#dfc0b3",
                "error": "#ba1a1a",
                "on-secondary-fixed-variant": "#474746",
                "outline": "#8b7267",
                "surface-container": "#ffeae1",
                "on-primary-fixed": "#351000",
                "primary-fixed-dim": "#ffb694",
                "surface-variant": "#f4ded5",
                "secondary-fixed-dim": "#c8c6c5",
                "surface-bright": "#fff8f6",
                "surface-container-highest": "#f4ded5",
                "surface-container-high": "#fae4db",
                "on-tertiary": "#ffffff",
                "on-secondary": "#ffffff",
                "inverse-primary": "#ffb694",
                "background": "#fff8f6",
                "on-tertiary-fixed-variant": "#004c6a",
                "on-error": "#ffffff",
                "primary": "#a14000",
                "on-primary-container": "#521d00",
                "surface-container-lowest": "#ffffff",
                "inverse-surface": "#3b2e28",
                "on-background": "#241914",
                "tertiary-fixed": "#c5e7ff",
                "tertiary": "#00658b",
                "on-tertiary-fixed": "#001e2d",
                "on-tertiary-container": "#003247",
                "error-container": "#ffdad6",
                "on-error-container": "#93000a",
                "primary-container": "#ed712e",
                "on-surface": "#241914",
                "secondary": "#5f5e5e",
                "on-surface-variant": "#574238",
                "on-primary": "#ffffff",
                "secondary-fixed": "#e5e2e1",
                "inverse-on-surface": "#ffede6",
                "secondary-container": "#e2dfde",
                "on-primary-fixed-variant": "#7b2f00"
        },
        "fontFamily": {
                "numeric-data": ["Space Grotesk"],
                "headline-md": ["Space Grotesk"],
                "body-base": ["Space Grotesk"],
                "mono-label": ["Space Grotesk"],
                "display-lg": ["Space Grotesk"]
        }
      }
    }
  }
</script>
<style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #fff8f6; color: #241914; margin: 0; overflow-x: hidden; }
        .sharp-border { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%); }
        .canvas-container { height: 400px; width: 100%; position: relative; background: radial-gradient(circle at center, #ffffff 0%, #fff1ec 100%); }
        .step-btn { transition: all 0.3s ease; border-left: 3px solid transparent; }
        .step-btn.active { border-left-color: #ED712E; background: rgba(237, 113, 46, 0.08); color: #a14000; }
        .status-badge { font-size: 10px; letter-spacing: 0.1em; background: rgba(237, 113, 46, 0.1); border: 1px solid #ED712E; color: #a14000; }
    </style>
</head>
<body class="bg-surface-bright text-on-surface">
<div class="max-w-4xl mx-auto p-4 flex flex-col gap-6">
<!-- 3D Header -->
<div class="flex justify-between items-end border-b border-outline-variant pb-2">
<div>
<span class="text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">MÓDULO INTERATIVO</span>
<h1 class="text-2xl font-bold uppercase tracking-tighter italic text-on-surface">REGUA_3D_LIVE</h1>
</div>
<div class="status-badge px-2 py-0.5 rounded-sm italic">SISTEMA_V2.04_READY</div>
</div>
<!-- Main Content Area -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start" id="interactive-content-wrapper">
<!-- Three.js Canvas -->
<div class="canvas-container sharp-border border border-outline-variant" id="threejs-container">
<div class="absolute top-4 left-4 z-10">
<div class="flex items-center gap-2 text-[10px] text-primary font-bold">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
                    VISUALIZAÇÃO EM TEMPO REAL
                </div>
</div>
<div class="absolute bottom-4 right-4 z-10 text-[10px] text-on-surface-variant font-mono">
                COORD: 23.5505° S, 46.6333° W
            </div>
</div>
<!-- Installation Steps -->
<div class="bg-surface-container-low p-4 sharp-border border border-outline-variant h-full">
<h2 class="text-xs font-bold text-on-surface-variant mb-4 uppercase tracking-widest">PROTOCOLO DE INSTALAÇÃO</h2>
<div class="flex flex-col gap-2">
<button class="step-btn active w-full text-left p-3 flex gap-4 items-center group" onclick="updateStep(1)">
<span class="font-mono text-on-surface-variant group-[.active]:text-primary">01</span>
<div>
<div class="text-sm font-bold uppercase">Cabo de Alimentação</div>
<div class="text-[10px] text-on-surface-variant">CONEXÃO_INPUT_AC</div>
</div>
</button>
<button class="step-btn w-full text-left p-3 flex gap-4 items-center group" onclick="updateStep(2)">
<span class="font-mono text-on-surface-variant group-[.active]:text-primary">02</span>
<div>
<div class="text-sm font-bold uppercase">Alimentação Modem</div>
<div class="text-[10px] text-on-surface-variant">GATEWAY_READY</div>
</div>
</button>
<button class="step-btn w-full text-left p-3 flex gap-4 items-center group" onclick="updateStep(3)">
<span class="font-mono text-on-surface-variant group-[.active]:text-primary">03</span>
<div>
<div class="text-sm font-bold uppercase">Conexão PC NUC</div>
<div class="text-[10px] text-on-surface-variant">CORE_SYNC</div>
</div>
</button>
<button class="step-btn w-full text-left p-3 flex gap-4 items-center group" onclick="updateStep(4)">
<span class="font-mono text-on-surface-variant group-[.active]:text-primary">04</span>
<div>
<div class="text-sm font-bold uppercase">Cabo Ethernet</div>
<div class="text-[10px] text-on-surface-variant">DATA_LINK_ESTABLISHED</div>
</div>
</button>
</div>
</div>
</div>
<!-- Technical Footer Info -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-3 border-l-2 border-primary shadow-sm">
<div class="text-[10px] text-on-surface-variant">STATUS_MCU</div>
<div class="text-xs font-bold uppercase text-on-surface">ESP32_LINK_ACTIVE</div>
</div>
<div class="bg-surface-container-low p-3 border-l-2 border-primary shadow-sm">
<div class="text-[10px] text-on-surface-variant">FIRMWARE</div>
<div class="text-xs font-bold uppercase text-on-surface">QUANTUM_V4_SECURE</div>
</div>
</div>
</div>
<script>
    let scene, camera, renderer, ruler;
    const container = document.getElementById('threejs-container');

    function init() {
        scene = new THREE.Scene();
        // Light background for Three.js
        scene.background = new THREE.Color(0xfff8f6);
        
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Dark ruler body for contrast in light mode
        const geometry = new THREE.BoxGeometry(1, 4, 1);
        const material = new THREE.MeshPhongMaterial({ color: 0x333333 });
        ruler = new THREE.Mesh(geometry, material);
        scene.add(ruler);

        const portGeo = new THREE.BoxGeometry(0.6, 0.3, 0.3);
        const ports = [];
        for(let i=0; i<4; i++) {
            const port = new THREE.Mesh(portGeo, new THREE.MeshPhongMaterial({ color: 0x8b7267 }));
            port.position.y = 1.5 - (i * 1.0);
            port.position.z = 0.5;
            ruler.add(port);
            ports.push(port);
        }
        ruler.userData.ports = ports;

        camera.position.z = 5;
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        ruler.rotation.y += 0.005;
        renderer.render(scene, camera);
    }

    window.updateStep = function(stepIndex) {
        document.querySelectorAll('.step-btn').forEach((btn, idx) => {
            if(idx === stepIndex - 1) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        ruler.userData.ports.forEach((port, idx) => {
            if(idx === stepIndex - 1) {
                port.material.color.setHex(0xED712E);
                port.scale.set(1.2, 1.2, 1.2);
            } else {
                port.material.color.setHex(0x8b7267);
                port.scale.set(1, 1, 1);
            }
        });
    }

    init();
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
</body></html>
